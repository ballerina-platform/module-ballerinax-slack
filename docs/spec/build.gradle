import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.process.ExecOperations
import javax.inject.Inject

abstract class ExecHelper {
    @Inject
    abstract ExecOperations getExecOperations()
}

def execHelper = project.objects.newInstance(ExecHelper)

def files = ["sanitations.bal"];

def buildAction = {
    doLast {
        try {
            files.each { file ->
                println("Building ${file} ...")
                execHelper.execOperations.exec {
                    workingDir project.projectDir
                    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
                        commandLine 'sh', "/c", "bal build ${file} && exit %%ERRORLEVEL%%"
                    } else {
                        commandLine 'sh', "-c", "bal build ${file}"
                    }
                }
            }
        } catch (Exception e) {
            println("Sanitation Script Build failed: " + e.message)
            throw e
        }
    }
}

if (!tasks.names.contains('build')) {
    tasks.register('build', buildAction)
} else {
    tasks.named('build', buildAction)
}
